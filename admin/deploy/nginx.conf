# Nocta Yönetim Paneli · nginx örnek yapılandırması
# dist/ klasörünün içeriğini /var/www/nocta-admin altına kopyalayın.
server {
    listen 80;
    server_name admin.ornek-alan-adi.com;

    root /var/www/nocta-admin;
    index index.html;

    # Arama motorlarında görünmesin
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Parmak izli derleme dosyaları: uzun süreli önbellek
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html hiçbir zaman önbelleğe alınmasın (yeni sürüm hemen görünsün)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Tek sayfa uygulama (SPA): bilinmeyen tüm yollar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# Panel bir alt klasörde yayınlanacaksa (ör. https://alan-adi.com/admin/):
#   1) .env içine VITE_BASE=/admin/ yazıp yeniden derleyin
#   2) location /admin/ { alias /var/www/nocta-admin/; try_files $uri $uri/ /admin/index.html; }
